name: SoftwareX Phase 2 TLC versus pytest controls

on:
  workflow_dispatch:
  push:
    branches: [softwarex-phase2-tlc-pytest-comparison]
    paths:
      - scripts/run_softwarex_phase2_2026.py
      - .github/workflows/softwarex-phase2-2026.yml

jobs:
  paired-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/install_tlc.py
      - name: Run paired TLC and pytest controls
        env:
          PYTHONPATH: backend
          FORMIPY_PHASE2_RESULTS: results/softwarex_phase2
        run: python scripts/run_softwarex_phase2_2026.py
      - name: Save verifier and pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FormiPy-SoftwareX-Phase2
          path: results/softwarex_phase2/
          if-no-files-found: warn
          retention-days: 90
