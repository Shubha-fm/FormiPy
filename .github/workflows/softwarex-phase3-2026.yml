name: SoftwareX Phase 3 property-aligned mutation study
on:
  workflow_dispatch:
  push:
    branches: [softwarex-phase3-property-mutations]
    paths:
      - scripts/run_softwarex_phase3_2026.py
      - .github/workflows/softwarex-phase3-2026.yml
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/install_tlc.py
      - name: Execute controlled TLC and pytest study
        env:
          PYTHONPATH: backend
          FORMIPY_PHASE3_PAIRS_PER_FAMILY: '10'
          FORMIPY_PHASE3_RESULTS: results/softwarex_phase3
        run: python scripts/run_softwarex_phase3_2026.py
      - name: Upload evidence whether successful or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FormiPy-SoftwareX-Phase3
          path: results/softwarex_phase3/
          if-no-files-found: warn
          retention-days: 90
