name: SoftwareX Phase 4 heterogeneous model benchmarks
on:
  workflow_dispatch:
  push:
    branches: [softwarex-phase4-heterogeneous-benchmarks]
    paths:
      - scripts/run_softwarex_phase4_2026.py
      - .github/workflows/softwarex-phase4-2026.yml
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/install_tlc.py
      - name: Execute diverse benchmark cases
        env:
          PYTHONPATH: backend
          FORMIPY_PHASE4_RESULTS: results/softwarex_phase4
        run: python scripts/run_softwarex_phase4_2026.py
      - name: Preserve raw results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FormiPy-SoftwareX-Phase4
          path: results/softwarex_phase4/
          retention-days: 90
          if-no-files-found: warn
