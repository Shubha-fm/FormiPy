name: FormiPy bounded semantic preservation audit
on:
  workflow_dispatch:
  push:
    branches: [formal-semantic-preservation-bounded-state-machine]
    paths:
      - backend/semantic_export.py
      - backend/main.py
      - backend/tests/test_semantic_export.py
      - .github/workflows/semantic-preservation-audit.yml
jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Execute bounded semantic preservation regression and mutation tests
        env:
          PYTHONPATH: backend
        run: python -m unittest backend.tests.test_semantic_export -v
      - name: Run all regression tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
